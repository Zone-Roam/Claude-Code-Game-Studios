# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: match_miss_dispatch
    status: active
    pattern: direct_call
    producer: round-flow
    consumers:
      - clear-effects
      - general-skills
      - battle-pressure
      - ui-interaction
    adr: docs/architecture/adr-0002-main-loop-round-clock.md
    signal_signature: "effects.onMatch(match) [-> pressure.comboReward() when combo >= threshold] -> skills.onMatch(match) -> pressure.onMatch(match)/onMiss(miss) -> emit(match|miss), fixed order, synchronous"
    referenced_by:
      - docs/architecture/adr-0002-main-loop-round-clock.md
      - docs/architecture/adr-0003-rules-view-channel.md
    added: 2026-10-27
    revised: "2026-10-30"
  - contract: rules_to_view_events
    status: active
    pattern: shared_resource
    producer: round-flow
    consumers:
      - ui-interaction
    adr: docs/architecture/adr-0003-rules-view-channel.md
    signal_signature: "emit(event) appends plain {type, ...} objects to the round outbox; view calls round.drainEvents() once per frame"
    referenced_by:
      - docs/architecture/adr-0003-rules-view-channel.md
    added: 2026-10-27
    revised: "2026-10-30"
  - contract: view_to_rules_intents
    status: active
    pattern: shared_resource
    producer: ui-interaction
    consumers:
      - round-flow
    adr: docs/architecture/adr-0003-rules-view-channel.md
    signal_signature: "input queue of {type: 'cell'|'card'|'offBoard'|'pauseStamp'|'button', ...} processed in round.frame step 2 in arrival order; cell/card/offBoard route to skills while a row/column pick is open (round-flow rule 5a)"
    referenced_by:
      - docs/architecture/adr-0003-rules-view-channel.md
      - docs/architecture/adr-0002-main-loop-round-clock.md
    added: 2026-10-27
    revised: "2026-10-30"
  - contract: lifecycle_entry_points
    status: active
    pattern: direct_call
    producer: platform-lifecycle
    consumers:
      - round-flow
    adr: docs/architecture/adr-0002-main-loop-round-clock.md
    signal_signature: "round.onHidden() / onVisible() / setLandscape(on) / onBack(), called immediately, never queued"
    referenced_by:
      - docs/architecture/adr-0002-main-loop-round-clock.md
      - docs/architecture/adr-0003-rules-view-channel.md
    added: 2026-10-27
    revised: ""
  - contract: storage_port
    status: active
    pattern: direct_call
    producer: platform-storage
    consumers:
      - progress-save
    adr: docs/architecture/adr-0004-local-save.md
    signal_signature: "{ read(key) -> string|null, write(key, value), remove(key) }; exceptions propagate, progress-save catches"
    referenced_by:
      - docs/architecture/adr-0004-local-save.md
    added: 2026-10-27
    revised: ""
  - contract: skills_to_pressure_calls
    status: active
    pattern: direct_call
    producer: general-skills
    consumers:
      - battle-pressure
    adr: docs/architecture/adr-0002-main-loop-round-clock.md
    signal_signature: "on skill token end: scareNextPush/canScare, addFood, roarBack, raiseShield/hasShield, breakSpecial, healHeart(n)/canHeal, refillFood(n)/canRefill; pressure emits heal/foodRefill itself"
    referenced_by:
      - docs/architecture/adr-0002-main-loop-round-clock.md
      - docs/architecture/adr-0003-rules-view-channel.md
    added: 2026-10-30
    revised: ""

