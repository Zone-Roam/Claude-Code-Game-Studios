# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: rules_layer_platform_access
    status: active
    description: "src/rules and src/core must not reference document, window, localStorage, Date.now, performance.now or Math.random"
    why: "rules must run and be tested in Node with injected time, seed and storage"
    adr: docs/architecture/adr-0001-no-engine-native-h5.md
    added: 2026-10-27
  - pattern: third_party_runtime_code
    status: active
    description: "no library, framework, CDN or copied third-party snippet in the shipped package"
    why: "user hard constraint; 2 MB budget"
    adr: docs/architecture/adr-0001-no-engine-native-h5.md
    added: 2026-10-27
  - pattern: cross_system_subscription
    status: active
    description: "rules modules must not subscribe to each other; settlement order lives only in round-flow"
    why: "subscription order becomes settlement order and reintroduces the races round-flow rule 6 removes"
    adr: docs/architecture/adr-0002-main-loop-round-clock.md
    added: 2026-10-27
  - pattern: animation_driven_rules
    status: active
    description: "the view must never advance rules on transitionend or a view timer; only tokens, gameTime and round's own overlay timers do. Sole exception: round.endingDone() (end -> settle), timed by the view from accumulated foreground dtReal, never transitionend or setTimeout"
    why: "animations can be skipped, throttled or paused by the host; rule timing would drift. endingDone is allowed because outcome, stars and save are fixed before it (ADR-0002 section 2)"
    adr: docs/architecture/adr-0003-rules-view-channel.md
    added: 2026-10-27
  - pattern: non_compositor_animation
    status: active
    description: "no CSS filter, backdrop-filter, mix-blend-mode, runtime SVG filter; no animating left/top/width/height/font-size"
    why: "low-end Android WebView frame budget (art bible section 8)"
    adr: docs/architecture/adr-0003-rules-view-channel.md
    added: 2026-10-27

