# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - target_fps: 60
    total_frame_budget_ms: 16.67
    platform: Mobile
    adr: docs/architecture/adr-0002-main-loop-round-clock.md
    added: 2026-10-27
    revised: ""
  - system: rules-step
    status: active
    budget_ms: 2.0
    adr: docs/architecture/adr-0002-main-loop-round-clock.md
    notes: "round.frame() incl. tap handling and tick, on the baseline Android phone (art bible section 8). A dead-board reshuffle frame may exceed it (ADR-0002 Performance Implications)"
    referenced_by:
      - docs/architecture/adr-0002-main-loop-round-clock.md
    added: 2026-10-27
    revised: ""
  - system: view-step
    status: active
    budget_ms: 4.0
    adr: docs/architecture/adr-0003-rules-view-channel.md
    notes: "view.render(): drain events, start CSS animations, diff HUD; browser style/layout/paint/composite take the rest of the 16.67 ms frame"
    referenced_by:
      - docs/architecture/adr-0003-rules-view-channel.md
    added: 2026-10-27
    revised: ""

