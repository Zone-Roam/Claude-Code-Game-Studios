# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: frame_driver
    status: active
    api: "requestAnimationFrame, called only in src/app/main-loop.mjs"
    not: "setTimeout / setInterval for any game timing"
    adr: docs/architecture/adr-0002-main-loop-round-clock.md
    reason: "one clock, tokens timed in foreground real time, testable with fake dtReal"
    referenced_by:
      - docs/architecture/adr-0002-main-loop-round-clock.md
    added: 2026-10-27
    revised: ""
  - purpose: randomness
    status: active
    api: "src/core/rng.mjs: hash32 (FNV-1a + fmix32) seeds, mulberry32 streams deal/shuffle/wave/add"
    not: "Math.random() anywhere in src/rules or src/core"
    adr: docs/architecture/adr-0002-main-loop-round-clock.md
    reason: "board-link rule 3 needs four independent reproducible streams"
    referenced_by:
      - docs/architecture/adr-0002-main-loop-round-clock.md
    added: 2026-10-27
    revised: ""
  - purpose: rendering
    status: active
    api: "DOM elements + one SVG link layer + inline <symbol> sprite, CSS transform/opacity animation"
    not: "Canvas 2D full-screen drawing"
    adr: docs/architecture/adr-0003-rules-view-channel.md
    reason: "system-font text legibility for older players; 48 cells is far inside the DOM budget"
    referenced_by:
      - docs/architecture/adr-0003-rules-view-channel.md
    added: 2026-10-27
    revised: ""
  - purpose: persistence
    status: active
    api: "window.localStorage through src/platform/storage.mjs"
    not: "IndexedDB / cookies"
    adr: docs/architecture/adr-0004-local-save.md
    reason: "synchronous, tiny record, widest support; swap the port if the probe says otherwise"
    referenced_by:
      - docs/architecture/adr-0004-local-save.md
    added: 2026-10-27
    revised: ""
  - purpose: release_packaging
    status: active
    api: "one self-contained HTML file built by tools/build/build.mjs (Node built-ins only)"
    not: "multi-file package, <script type=module>, fetch of local files in the release build"
    adr: docs/architecture/adr-0001-no-engine-native-h5.md
    reason: "runs whatever the unverified host supports"
    referenced_by:
      - docs/architecture/adr-0001-no-engine-native-h5.md
    added: 2026-10-27
    revised: ""

