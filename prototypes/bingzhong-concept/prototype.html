<!doctype html>

<style>
  :root { --bg:#f6ecd6; --ink:#2a2018; --muted:#7d6a52; --red:#b8322a; --gold:#c99a2e; --edge:#d8c3a0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;

    padding:10px 12px calc(12px + env(safe-area-inset-bottom)); }
  #top { width:100%; max-width:480px; }
  #bar { display:flex; align-items:center; justify-content:space-between; gap:8px; }

    transition:transform .12s, opacity .25s; cursor:pointer; }
  .tile.fx { border-color:var(--red); box-shadow:0 3px 0 var(--red); }
  .tile .badge { position:absolute; right:1px; bottom:1px; font-size:38%; background:rgba(255,255,255,.85); border-radius:6px; padding:1px 2px; }
  .tile.hero { border-color:var(--gold); box-shadow:0 3px 0 var(--gold); background:#fff3d6; }
  .tile.hit { background:#ffb199 !important; transform:scale(1.08); }
  .face { width:82%; height:82%; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:"STKaiti","KaiTi","Kaiti SC",serif; font-weight:800; }
  .tile.sel { border-color:var(--red); box-shadow:0 0 0 4px var(--red); transform:translateY(-3px); }
  .tile.shake { animation:shake .3s; }
  .tile.gone { opacity:0; transform:scale(.4) rotate(-12deg); pointer-events:none; }
  @keyframes shake { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }

  .card { width:100%; max-width:360px; background:#fffaf0; border-radius:18px; padding:22px 20px; text-align:center;

    background:#fff; color:var(--red); }

<body>
<div id="app">
  <div id="top">

</div></div>

<script>
// Tuning via URL: ?line=0 (台词关) &linems=800 &time=180
const P = new URLSearchParams(location.search);
const LINE_ON = P.get('line') !== '0';
const LINE_MS = +P.get('linems') || 800;
const TIME_OVERRIDE = +P.get('time') || 0;
const COMBO_WINDOW = 3000, COMBO_BONUS = 1;

const KINDS = {
  火: { icon:'🔥', tint:'#fbe0cf' }, 营: { icon:'⛺', tint:'#e6efd9' },
  马: { icon:'🐎', tint:'#f3e1c8' }, 弓: { icon:'🏹', tint:'#e9e4f2' },
  水: { icon:'🌊', tint:'#dbe8ff' }, 城: { icon:'🏯', tint:'#e3e0d6' },
  刀: { icon:'⚔️', tint:'#ece5d7' }, 盾: { icon:'🛡️', tint:'#dfe9f3' },
  旗: { icon:'🚩', tint:'#f6dcd8' }, 鼓: { icon:'🥁', tint:'#f2e5c9' }, 酒: { icon:'🍶', tint:'#efe6cf' },
};
// Clearing a pair of the key kind wipes every tile of the target kind (always an even count, so the board stays solvable).
const EFFECTS = {
  火: { target:'营', text:'火烧连营！' },
  马: { target:'弓', text:'铁骑冲阵！' },
  水: { target:'城', text:'水淹七军！' },
};
const KIND_IDS = Object.keys(KINDS);
const HEROES = {
  刘: { bg:'#f6dcc0', ink:'#5a3a1a', name:'刘备' },
  关: { bg:'#c8322a', ink:'#fff',    name:'关羽' },
  张: { bg:'#262626', ink:'#fff',    name:'张飞' },
  吕: { bg:'#efe6f7', ink:'#5b2a86', name:'吕布' },
  赵: { bg:'#e1eefc', ink:'#1d4f99', name:'赵云' },
  曹: { bg:'#fbfbf6', ink:'#222',    name:'曹操' },
};
// deck: tile counts per kind (heroes add 6 more); counts are even and sum to rows*cols-6
const ROUNDS = [
  { no:'第一回', title:'宴桃园豪杰三结义', rows:6, cols:6, time:120,
    deck:{ 火:2, 营:8, 刀:4, 盾:4, 旗:4, 鼓:4, 酒:4 },
    lines:{ 刘:'刘备在此！今日结为兄弟，同心协力，救困扶危！', 关:'关某愿随兄长，上报国家，下安黎庶！', 张:'俺也一样！' } },
  { no:'第二回', title:'虎牢关三英战吕布', rows:7, cols:6, time:120,
    deck:{ 火:2, 营:6, 马:2, 弓:8, 刀:4, 盾:4, 旗:6, 鼓:4 },
    lines:{ 吕:'吾乃吕布吕奉先，谁敢与我一战！', 张:'三姓家奴休走！燕人张飞来也！', 关:'青龙偃月刀在此，吕布看刀！' } },
  { no:'第三回', title:'赵子龙单骑救主', rows:8, cols:6, time:120,
    deck:{ 火:2, 营:6, 马:2, 弓:6, 水:2, 城:8, 刀:4, 盾:4, 旗:4, 鼓:4 },
    lines:{ 赵:'常山赵子龙在此！挡我者死！', 张:'燕人张翼德在此！谁敢与我决一死战？', 曹:'好一员虎将！传我将令：只许活捉，不许放冷箭！' } },
];
const NUM = ['','一','二','三','四','五','六','七','八','九','十'];

const $ = id => document.getElementById(id);
const board = $('board'), svg = $('lines');
let R, ROWS, COLS, heroKeys, grid, els, sel, over, busy, timer;
let ri = 0, timeLimit, elapsed, lastTick, paused, sayT, comboT;
let combo, maxCombo, lastClear, linesShown, pairsLeft, totalPairs, reshuffles, fxFired, fxTiles;
const log = [];
let T = 56, PAD = 18;

const idOf = name => KIND_IDS.indexOf(name) + 1;
const nameOf = v => KIND_IDS[v - 1];
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// ---- connect rule (copied, prototypes never import each other) ----
const empty = (r, c) => grid[r][c] === 0;
function lineClear(r1, c1, r2, c2) {
  if (r1 === r2) { for (let c = Math.min(c1, c2) + 1; c < Math.max(c1, c2); c++) if (!empty(r1, c)) return false; return true; }
  if (c1 === c2) { for (let r = Math.min(r1, r2) + 1; r < Math.max(r1, r2); r++) if (!empty(r, c1)) return false; return true; }
  return false;
}
function oneCorner(a, b) {
  for (const k of [[a[0], b[1]], [b[0], a[1]]])
    if (empty(k[0], k[1]) && lineClear(a[0], a[1], k[0], k[1]) && lineClear(k[0], k[1], b[0], b[1])) return k;
  return null;
}
function findPath(a, b) {
  if ((a[0] === b[0] || a[1] === b[1]) && lineClear(a[0], a[1], b[0], b[1])) return [a, b];
  const k = oneCorner(a, b);
  if (k) return [a, k, b];
  for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    let r = a[0] + dr, c = a[1] + dc;
    while (r >= 0 && r <= ROWS + 1 && c >= 0 && c <= COLS + 1 && empty(r, c)) {
      const k2 = oneCorner([r, c], b);
      if (k2) return [a, [r, c], k2, b];
      r += dr; c += dc;
    }
  }
  return null;
}
function findAnyPair() {
  const byKind = {};
  for (let r = 1; r <= ROWS; r++) for (let c = 1; c <= COLS; c++)
    if (grid[r][c]) (byKind[grid[r][c]] = byKind[grid[r][c]] || []).push([r, c]);
  for (const list of Object.values(byKind))
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++)
      if (findPath(list[i], list[j])) return [list[i], list[j]];
  return null;
}

// ---- rendering ----
const isHero = v => v >= 100;
const px = c => c === 0 ? PAD / 2 : c === COLS + 1 ? PAD + COLS * T + PAD / 2 : PAD + (c - 1) * T + T / 2;
const py = r => r === 0 ? PAD / 2 : r === ROWS + 1 ? PAD + ROWS * T + PAD / 2 : PAD + (r - 1) * T + T / 2;

function layout() {
  const W = Math.min(window.innerWidth, 480) - 24;
  const H = window.innerHeight - $('top').offsetHeight - 36;
  T = Math.max(24, Math.floor(Math.min(W / (COLS + 0.6), H / (ROWS + 0.6), 78)));
  PAD = Math.round(T * 0.3);
  const bw = COLS * T + 2 * PAD, bh = ROWS * T + 2 * PAD;
  board.style.width = bw + 'px'; board.style.height = bh + 'px';
  $('stage').style.width = bw + 'px';
  svg.setAttribute('width', bw); svg.setAttribute('height', bh);
  for (let r = 1; r <= ROWS; r++) for (let c = 1; c <= COLS; c++) {
    const el = els[r][c];
    el.style.left = (PAD + (c - 1) * T + 2) + 'px';
    el.style.top = (PAD + (r - 1) * T + 2) + 'px';
    el.style.width = el.style.height = (T - 4) + 'px';
    el.style.fontSize = Math.round(T * 0.56) + 'px';
  }
}
function faceHTML(key, size) {
  const h = HEROES[key];
  return '<div class="face" style="background:' + h.bg + ';color:' + h.ink + ';font-size:' + size + 'px">' + key + '</div>';
}
function paint(r, c) {
  const v = grid[r][c], el = els[r][c];
  el.classList.toggle('gone', !v);
  if (!v) return;
  el.classList.toggle('hero', isHero(v));
  if (isHero(v)) { el.classList.remove('fx'); el.innerHTML = faceHTML(heroKeys[v - 100], Math.round(T * 0.42)); el.style.background = ''; return; }
  const n = nameOf(v), fx = EFFECTS[n];
  el.classList.toggle('fx', !!fx);
  el.innerHTML = KINDS[n].icon + (fx ? '<span class="badge">→' + KINDS[fx.target].icon + '</span>' : '');
  el.style.background = KINDS[n].tint;
}
function drawPath(path) {
  const pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  pl.setAttribute('points', path.map(([r, c]) => px(c) + ',' + py(r)).join(' '));
  pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', '#b8322a'); pl.setAttribute('stroke-width', Math.max(4, T / 11));
  pl.setAttribute('stroke-linecap', 'round'); pl.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(pl);
  setTimeout(() => pl.remove(), 300);
}
function hud() {
  const left = Math.max(0, timeLimit - elapsed / 1000);
  $('time').textContent = Math.ceil(left);
  $('time').classList.toggle('low', left <= 10);
  $('left').textContent = '剩 ' + pairsLeft + ' 对';
  return left;
}
function ruleText() {
  return Object.keys(EFFECTS).filter(k => R.deck[k]).map(k =>
    '消一对 ' + KINDS[k].icon + '，所有 ' + KINDS[EFFECTS[k].target].icon + ' 一起清掉').join('<br>');
}

// ---- round flow ----
function buildRound() {
  R = ROUNDS[ri]; ROWS = R.rows; COLS = R.cols; heroKeys = Object.keys(R.lines);
  grid = Array.from({ length: ROWS + 2 }, () => Array(COLS + 2).fill(0));
  totalPairs = pairsLeft = ROWS * COLS / 2;
  const deck = [];
  heroKeys.forEach((k, i) => deck.push(100 + i, 100 + i));
  for (const [name, n] of Object.entries(R.deck)) for (let i = 0; i < n; i++) deck.push(idOf(name));
  shuffle(deck);
  for (let r = 1; r <= ROWS; r++) for (let c = 1; c <= COLS; c++) grid[r][c] = deck.pop();
  if (!findAnyPair()) reshuffle(false);
  board.querySelectorAll('.tile').forEach(e => e.remove());
  els = [];
  for (let r = 1; r <= ROWS; r++) {
    els[r] = [];
    for (let c = 1; c <= COLS; c++) {
      const el = document.createElement('div');
      el.className = 'tile'; el.dataset.r = r; el.dataset.c = c;
      board.appendChild(el); els[r][c] = el;
    }
  }
  layout();
  for (let r = 1; r <= ROWS; r++) for (let c = 1; c <= COLS; c++) paint(r, c);
  sel = null; over = true; busy = false; paused = false;
  timeLimit = TIME_OVERRIDE || R.time; elapsed = 0;
  combo = 0; maxCombo = 0; lastClear = -1e9; linesShown = 0; reshuffles = 0; fxFired = 0; fxTiles = 0;
  clearInterval(timer);
  $('round').textContent = R.no;
  $('rule').innerHTML = ruleText();
  hud();
  $('end').classList.remove('on');
  $('iNo').textContent = R.no; $('iTitle').textContent = R.title;
  $('iRule').innerHTML = ruleText();
  $('intro').classList.add('on');
}
function startRound() {
  $('intro').classList.remove('on');
  over = false; lastTick = Date.now();
  timer = setInterval(() => {
    const now = Date.now();
    if (!paused) elapsed += now - lastTick;
    lastTick = now;
    if (hud() <= 0) finish(false);
  }, 100);
}
function reshuffle(count = true) {
  const cells = [], vals = [];
  for (let r = 1; r <= ROWS; r++) for (let c = 1; c <= COLS; c++) if (grid[r][c]) { cells.push([r, c]); vals.push(grid[r][c]); }
  for (let tries = 0; tries < 100; tries++) {
    shuffle(vals);
    cells.forEach(([r, c], i) => grid[r][c] = vals[i]);
    if (findAnyPair()) break;
  }
  if (count) { reshuffles++; cells.forEach(([r, c]) => paint(r, c)); }
}
function setSel(p) {
  if (sel) els[sel[0]][sel[1]].classList.remove('sel');
  sel = p;
  if (sel) els[sel[0]][sel[1]].classList.add('sel');
}
function shake(r, c) {
  const el = els[r][c];
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}
function flash(text, ms = 650) {
  const el = $('combo');
  el.innerHTML = text;
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  clearTimeout(comboT); comboT = setTimeout(() => el.classList.remove('on'), ms);
}
function boardShake() { board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake'); }
function showCombo(n) {
  flash((n <= 10 ? NUM[n] : n) + '连斩！');
  if (n >= 3) boardShake();
}
function say(key) {
  const h = HEROES[key];
  $('say').querySelector('.face').outerHTML = faceHTML(key, 30);
  $('say').querySelector('.who').textContent = h.name + '：';
  $('say').querySelector('.text').textContent = R.lines[key];
  $('say').classList.add('on');
  paused = true; linesShown++;
  clearTimeout(sayT);
  sayT = setTimeout(() => { $('say').classList.remove('on'); paused = false; }, LINE_MS);
}
function afterClear() {
  hud();
  if (!pairsLeft) return finish(true);
  if (!findAnyPair()) {
    busy = true;
    setTimeout(() => { reshuffle(); busy = false; }, 350);
  }
}
// Fire the effect of a cleared pair: highlight every target tile, then wipe them together.
function fire(name) {
  const fx = EFFECTS[name], tid = idOf(fx.target), hit = [];
  for (let r = 1; r <= ROWS; r++) for (let c = 1; c <= COLS; c++) if (grid[r][c] === tid) hit.push([r, c]);
  if (!hit.length) { flash(fx.text + '<br><small>可惜已经没有' + KINDS[fx.target].icon + '了</small>', 900); return false; }
  fxFired++; fxTiles += hit.length;
  busy = true;
  hit.forEach(([r, c]) => els[r][c].classList.add('hit'));
  flash(fx.text + '<br>清掉 ' + hit.length + ' 个' + KINDS[fx.target].icon, 900);
  boardShake();
  setTimeout(() => {
    hit.forEach(([r, c]) => { grid[r][c] = 0; els[r][c].classList.remove('hit'); paint(r, c); });
    pairsLeft -= hit.length / 2;
    busy = false;
    afterClear();
  }, 380);
  return true;
}
function tap(r, c) {
  if (over || busy || !grid[r][c]) return;
  if (!sel) return setSel([r, c]);
  if (sel[0] === r && sel[1] === c) return setSel(null);
  const a = sel, b = [r, c], v = grid[r][c];
  if (grid[a[0]][a[1]] !== v) return setSel(b);
  const path = findPath(a, b);
  if (!path) { shake(a[0], a[1]); shake(r, c); return setSel(b); }
  setSel(null);
  drawPath(path);
  grid[a[0]][a[1]] = 0; grid[r][c] = 0;
  paint(a[0], a[1]); paint(r, c);
  pairsLeft--;
  combo = elapsed - lastClear <= COMBO_WINDOW ? combo + 1 : 1;
  lastClear = elapsed;
  maxCombo = Math.max(maxCombo, combo);
  if (combo >= 2) timeLimit += COMBO_BONUS;
  if (isHero(v) && LINE_ON) say(heroKeys[v - 100]);
  if (!isHero(v) && EFFECTS[nameOf(v)] && fire(nameOf(v))) return;
  if (combo >= 2) showCombo(combo);
  afterClear();
}
function finish(win) {
  over = true; clearInterval(timer); setSel(null);
  const secs = Math.round(elapsed / 1000);
  log.push({ round: R.no, win, secs, cleared: totalPairs - pairsLeft, totalPairs, maxCombo, fxFired, fxTiles, reshuffles, then: '' });
  console.table(log);
  setTimeout(() => {
    const last = ri === ROUNDS.length - 1;
    $('eNo').textContent = R.no + (win ? ' 完' : '');
    $('eTitle').textContent = win ? R.title : '撤军！';
    $('eMain').textContent = (win ? '用时 ' + secs + ' 秒' : '消了 ' + (totalPairs - pairsLeft) + ' / ' + totalPairs + ' 对') +
      ' · 兵种效果 ' + fxFired + ' 次，一共清掉 ' + fxTiles + ' 块';
    $('eNext').textContent = win ? (last ? '原型就到这里（共三回）。' : '下一回：' + ROUNDS[ri + 1].title) : '不要紧，再来一回';
    $('eLog').innerHTML = log.map(x => '<li>' + x.round + '：' + (x.win ? '胜 ' + x.secs + ' 秒' : '撤军 ' + x.cleared + '/' + x.totalPairs) +
      '，最高 ' + x.maxCombo + ' 连斩，效果清掉 ' + x.fxTiles + ' 块' + (x.then ? '，然后' + x.then : '') + '</li>').join('');
    $('next').style.display = win ? '' : 'none';
    $('next').textContent = last ? '从头再来' : '下一回';
    $('end').classList.add('on');
  }, win ? 500 : 0);
}

board.addEventListener('pointerdown', e => {
  const t = e.target.closest('.tile');
  if (t && !t.classList.contains('gone')) tap(+t.dataset.r, +t.dataset.c);
});
$('go').addEventListener('click', startRound);
$('again').addEventListener('click', () => { log[log.length - 1].then = '再来'; buildRound(); });
$('next').addEventListener('click', () => {
  log[log.length - 1].then = ri === ROUNDS.length - 1 ? '从头' : '下一回';
  ri = (ri + 1) % ROUNDS.length; buildRound();
});
window.addEventListener('resize', () => layout());
buildRound();
</script>
</body>
</html>
