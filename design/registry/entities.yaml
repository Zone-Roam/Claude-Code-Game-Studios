#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: dt_game
    status: active
    source: design/gdd/round-flow.md
    referenced_by:
      - design/gdd/round-flow.md
      - design/gdd/battle-pressure.md
      - design/gdd/clear-effects.md
    variables:
      - dtReal
      - MAX_STEP_MS
      - running
      - BG_GAP_MS
    output_range: [0, 250]
    expression: "running ? clamp(dtReal, 0, MAX_STEP_MS) : 0; running = state == 对局 && tokens empty && dtReal <= BG_GAP_MS"  # was: running ? min(dtReal, MAX_STEP_MS) : 0
    added: 2026-10-27
    revised: 2026-10-27
  - name: combo_count
    status: active
    source: design/gdd/clear-effects.md
    referenced_by:
      - design/gdd/clear-effects.md
      - design/gdd/battle-pressure.md
      - design/gdd/general-skills.md
    variables:
      - match
      - miss
    output_range: [1, 999]
    expression: "match: combo + 1; miss: 0; effects, skills, reshuffle and enemy attacks leave it unchanged"  # was: gameTime - lastPlayerClearAt <= COMBO_WINDOW_MS ? combo + 1 : 1
    added: 2026-10-27
    revised: 2026-10-30
  - name: press_schedule
    status: active
    source: design/gdd/battle-pressure.md
    referenced_by:
      - design/gdd/battle-pressure.md
      - design/gdd/clear-effects.md
      - design/gdd/general-skills.md
    variables:
      - interval
      - waves
      - comboDelay_w
      - scare
    output_range: [4000, 999999]
    expression: "nextPush = gameTime + interval after every push or scared push; nextPush += comboDelay (<= PRESS_DELAY_CAP_MS between pushes); a scare (张飞) cancels the next timed push"  # was: nextPush = gameTime + interval ... + roarDelay (张飞 now scares the next push instead)
    added: 2026-10-27
    revised: 2026-10-27
  - name: food_start
    status: active
    source: design/gdd/battle-pressure.md
    referenced_by:
      - design/gdd/battle-pressure.md
      - design/gdd/chapter-design.md
    variables:
      - deck
      - target
      - slack
    output_range: [1, 30]  # was: [1, 40] (max board 24 pairs + slack 6)
    expression: "pairs - wipePairs + slack"
    added: 2026-10-27
    revised: 2026-10-27
  - name: boss_charge
    status: deprecated  # 2026-10-30：改为按步出手，见公式 boss_steps（切片第五版）
    source: design/gdd/battle-pressure.md
    referenced_by:
      - design/gdd/battle-pressure.md
      - design/gdd/clear-effects.md
      - design/gdd/general-skills.md
      - design/gdd/ui-interaction.md
    variables:
      - chargeMs
      - MISS_CHARGE
      - BOSS_INTERRUPT
      - dtGame
      - BOSS_INTERRUPT_CAP
      - interruptSinceAttack
    output_range: [0, 100]
    expression: "per event, clamped [0,100]: tick +100*dtGame/chargeMs; miss +MISS_CHARGE; comboReward -min(BOSS_INTERRUPT, BOSS_INTERRUPT_CAP - interruptSinceAttack, charge); attack at 100 when hp > 0, resets interruptSinceAttack"  # was: per event ... comboReward -BOSS_INTERRUPT (no cap)
    added: 2026-10-27
    revised: 2026-10-27
  - name: boss_steps
    status: active
    source: design/gdd/battle-pressure.md
    referenced_by:
      - design/gdd/battle-pressure.md
      - design/gdd/clear-effects.md
      - design/gdd/general-skills.md
      - design/gdd/chapter-design.md
      - design/gdd/ui-interaction.md
    variables:
      - STEP_MATCH
      - STEP_MISS
      - COMBO_PUSHBACK
      - COMBO_PUSHBACK_CAP
      - ZHANG_PUSHBACK
      - ZHANG_STUN
      - steps
    output_range: [0, 20]
    expression: "per player action: match +STEP_MATCH, miss +STEP_MISS (stun eats steps); combo >= threshold: -COMBO_PUSHBACK (<= CAP per attack) before the match step; 张飞 -ZHANG_PUSHBACK and stun ZHANG_STUN; attack when count >= steps (phase 2: phase2.steps), then reset to 0"
